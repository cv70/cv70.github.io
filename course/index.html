<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/assets/style/style.css">
    <link rel="stylesheet" type="text/css" href="/assets/style/scoreboard.css">
    <title>在线课程 - 洞察哥空间</title>
    <style>
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        .course-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .course-card-header {
            padding: 2rem;
            color: white;
        }

        .course-card-header h3 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        .course-card-header p {
            opacity: 0.9;
            margin: 0;
        }

        .course-card-body {
            background: white;
            padding: 1.5rem;
        }

        .course-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .course-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .course-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .course-tag {
            background: #f0f0f0;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            color: #666;
        }

        .course-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .btn-start:hover {
            opacity: 0.9;
        }

        .course-meta {
            font-size: 0.85rem;
            color: #999;
        }

        .coming-soon {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        }

        .coming-soon .course-card-body {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="/">网站首页</a>
            <a href="/game/">在线游戏</a>
            <a href="/tool/">在线工具</a>
            <a href="/course/" class="active">在线课程</a>
            <a href="/tips/">充电打赏</a>
        </nav>
    </header>

    <main>
        <article>
            <h2>在线课程</h2>
            <p>探索编程世界，从入门到精通的完整学习路径。每一门课程都经过精心设计，帮助你系统地掌握技术知识。</p>

            <div class="course-grid">
                <div class="course-card">
                    <div class="course-card-header">
                        <h3>AI应用开发课程</h3>
                        <p>从零基础到实战专家的完整学习路径</p>
                    </div>
                    <div class="course-card-body">
                        <div class="course-stats">
                            <span class="course-stat">📚 53章</span>
                            <span class="course-stat">📝 260+节</span>
                            <span class="course-stat">💻 8个实战项目</span>
                        </div>
                        <div class="course-tags">
                            <span class="course-tag">人工智能</span>
                            <span class="course-tag">机器学习</span>
                            <span class="course-tag">深度学习</span>
                            <span class="course-tag">大语言模型</span>
                            <span class="course-tag">Python</span>
                        </div>
                        <div class="course-card-footer">
                            <span class="course-meta">更新于 2024年4月</span>
                            <a href="/course/ai-app-dev/" class="btn-start">开始学习</a>
                        </div>
                    </div>
                </div>

                <!-- 更多课程卡片可以在这里添加 -->
            </div>
        </article>
    </main>

    <footer>
        洞察哥空间 © 2024
    </footer>

    <script src="/assets/js/scoreboard.js"></script>
    <script src="/assets/js/search.js"></script>
</body>

</html>
