<pre// FPGA设计示例
module example (
    input  wire clk,
    input  wire rst_n,
    input  wire [7:0] data_in,
    output wire [7:0] data_out
);

// 简单的数据处理逻辑
reg [7:0] data_reg;

always @(posedge clk or negedge rst_n) begin
    if (!rst_n) begin
        data_reg <= 8'h00;
    end else begin
        data_reg <= data_in + 1;
    end
end

assign data_out = data_reg;

endmodule</pre>
