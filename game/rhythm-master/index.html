<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节奏大师 - 洞察哥空间</title>
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/style/style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="header-container"></div>

    <div id="game-container">
        <h1>🎵 节奏大师</h1>

        <div id="score-container">
            <div class="score-box">
                <span class="score-label">分数</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">连击</span>
                <span id="combo">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">最佳</span>
                <span id="best">0</span>
            </div>
        </div>

        <div id="difficulty-selector">
            <button class="diff-btn active" data-diff="easy">简单</button>
            <button class="diff-btn" data-diff="normal">普通</button>
            <button class="diff-btn" data-diff="hard">困难</button>
        </div>

        <div id="game-header">
            <p class="instructions">使用 <strong>D F J K</strong> 或 <strong>触摸轨道</strong> 按键</p>
            <button id="start-btn">开始游戏</button>
        </div>

        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
            <div id="game-message"></div>
            <div id="judge-display"></div>
        </div>

        <div class="game-footer">
            <p>跟着音乐节奏，挑战你的反应速度！</p>
        </div>
    </div>

    <script src="./game.js"></script>

    <div id="footer-container"></div>
    <script src="/assets/js/load-components.js"></script>
</body>
</html>
