<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹幕躲避 - 洞察哥空间</title>
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/style/style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="header-container"></div>

    <div id="game-container">
        <h1>💥 弹幕躲避</h1>

        <div id="score-container">
            <div class="score-box">
                <span class="score-label">生存时间</span>
                <span id="score">0s</span>
            </div>
            <div class="score-box">
                <span class="score-label">生命</span>
                <span id="lives">3</span>
            </div>
            <div class="score-box">
                <span class="score-label">最佳</span>
                <span id="best">0s</span>
            </div>
        </div>

        <div id="powerup-indicator">
            <span>护盾: </span>
            <span id="shield-status">无</span>
        </div>

        <div id="game-header">
            <p class="instructions">使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动</p>
            <button id="start-btn">开始游戏</button>
        </div>

        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
            <div id="game-message"></div>
        </div>

        <div class="game-footer">
            <p>在弹幕中生存，挑战你的反应极限！</p>
        </div>
    </div>

    <script src="./game.js"></script>

    <div id="footer-container"></div>
    <script src="/assets/js/load-components.js"></script>
</body>
</html>
