<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堆叠游戏 - 洞察哥空间</title>
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/style/style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="header-container"></div>

    <div id="game-container">
        <h1>🏗️ 堆叠游戏</h1>

        <div id="score-container">
            <div class="score-box">
                <span class="score-label">高度</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">最佳</span>
                <span id="best">0</span>
            </div>
        </div>

        <div id="game-header">
            <p class="instructions">点击屏幕或按下<strong>空格键</strong>放置方块</p>
            <button id="new-game-btn">新游戏</button>
        </div>

        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
            <div id="game-message"></div>
        </div>

        <div class="game-footer">
            <p>精准堆叠，建造你的高塔！完美放置获得额外奖励！</p>
        </div>
    </div>

    <script src="./game.js"></script>

    <div id="footer-container"></div>
    <script src="/assets/js/load-components.js"></script>
</body>
</html>
