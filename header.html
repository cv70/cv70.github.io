<header>
    <nav>
        <div class="nav-links">
            <a href="/">网站首页</a>
            <a href="/game/">在线游戏</a>
            <a href="/tool/">在线工具</a>
            <a href="/course/">在线课程</a>
            <a href="/article/">在线文章</a>
            <a href="/tips/">充电打赏</a>
        </div>
        <div class="nav-search">
            <input type="text" id="global-search" placeholder="搜索... (Ctrl+K)" autocomplete="off">
            <span class="search-icon">🔍</span>
        </div>
    </nav>
</header>
<div id="search-results"></div>
<style>
/* 导航栏布局 */
header nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 var(--spacing-xl);
}

.nav-links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--spacing-xs);
    flex: 1;
}

/* 导航栏搜索框样式 */
.nav-search {
    position: relative;
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.nav-search input {
    padding: 8px 16px 8px 36px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 0.875rem;
    outline: none;
    transition: var(--transition);
    width: 180px;
}

.nav-search input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    width: 220px;
}

.nav-search input::placeholder {
    color: var(--text-muted);
}

.nav-search .search-icon {
    position: absolute;
    left: 12px;
    font-size: 0.875rem;
    opacity: 0.6;
    pointer-events: none;
}

/* 搜索结果下拉框 */
#search-results {
    display: none;
    position: fixed;
    top: calc(var(--header-height) + 8px);
    right: var(--spacing-xl);
    width: 320px;
    max-height: 400px;
    overflow-y: auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    z-index: 1000;
}

.search-result-item {
    display: block;
    padding: var(--spacing-md);
    text-decoration: none;
    border-bottom: 1px solid var(--border-color);
    transition: var(--transition);
}

.search-result-item:last-child {
    border-bottom: none;
}

.search-result-item:hover {
    background: rgba(0, 212, 255, 0.1);
}

.search-result-title {
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
}

.search-result-title mark {
    background: rgba(0, 212, 255, 0.3);
    color: var(--text-primary);
    padding: 0 2px;
    border-radius: 2px;
}

.search-result-category {
    font-size: 0.75rem;
    padding: 2px 8px;
    background: var(--gradient-primary);
    color: white;
    border-radius: var(--radius-full);
}

.search-result-desc {
    font-size: 0.8rem;
    color: var(--text-secondary);
}

.search-no-result {
    padding: var(--spacing-xl);
    text-align: center;
    color: var(--text-muted);
}

/* 移动端适配 */
@media (max-width: 768px) {
    header nav {
        flex-wrap: wrap;
        padding: 0 var(--spacing-md);
    }

    .nav-links {
        order: 1;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }

    .nav-search {
        order: 2;
        width: 100%;
        margin-top: var(--spacing-sm);
    }

    .nav-search input {
        width: 100%;
    }

    .nav-search input:focus {
        width: 100%;
    }

    #search-results {
        left: var(--spacing-md);
        right: var(--spacing-md);
        width: auto;
    }
}
</style>
<script>
// 根据当前路径高亮导航链接
document.addEventListener('DOMContentLoaded', function() {
    const navLinks = document.querySelector('.nav-links');
    if (!navLinks) return;

    const links = navLinks.querySelectorAll('a');
    const currentPath = window.location.pathname;

    links.forEach(link => {
        const href = link.getAttribute('href');
        link.classList.remove('active');

        // 完全匹配或者是子路径
        if (currentPath === href ||
            (href !== '/' && currentPath.startsWith(href))) {
            link.classList.add('active');
        }
    });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
<script src="/assets/js/search.js"></script>
