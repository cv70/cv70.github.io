<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="/assets/style/style.css">
    <link rel="stylesheet" type="text/css" href="/assets/style/scoreboard.css">
    <title>404 - 页面未找到 - 洞察哥空间</title>
    <style>
        #error-container {
            text-align: center;
            padding: 150px 20px 80px;
        }

        #error-container h1 {
            font-size: 120px;
            margin: 0;
            color: #3498db;
            text-shadow: 3px 3px 0 #2c3e50;
        }

        #error-container h2 {
            color: #2c3e50;
            margin: 20px 0;
        }

        .dark-mode #error-container h2 {
            color: #ecf0f1;
        }

        #error-container p {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 15px 40px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .home-btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .emoji-animation {
            font-size: 60px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .suggestions {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .dark-mode .suggestions {
            background: #2c3e50;
        }

        .suggestions h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .dark-mode .suggestions h3 {
            color: #ecf0f1;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            margin: 10px 0;
        }

        .suggestions a {
            color: #3498db;
            text-decoration: none;
        }

        .suggestions a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            #error-container h1 {
                font-size: 80px;
            }

            .emoji-animation {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div id="error-container">
        <div class="emoji-animation">🔍</div>
        <h1>404</h1>
        <h2>页面未找到</h2>
        <p>抱歉，你访问的页面不存在或已被移除</p>
        <a href="/" class="home-btn">返回首页</a>

        <div class="suggestions">
            <h3>你可能想访问：</h3>
            <ul>
                <li><a href="/game/">在线游戏</a> - 各种经典小游戏</li>
                <li><a href="/tool/">在线工具</a> - 实用开发工具</li>
                <li><a href="/game/snake/">贪吃蛇</a> - 经典贪吃蛇</li>
                <li><a href="/game/2048/">2048</a> - 数字消除游戏</li>
                <li><a href="/tool/password/">密码生成器</a> - 安全密码生成</li>
            </ul>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/assets/js/load-components.js"></script>
    <script src="/assets/js/dark-mode.js"></script>
    <script src="/assets/js/scoreboard.js"></script>
</body>
</html>
