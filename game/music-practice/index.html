<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音游练习 - 洞察哥空间</title>
    <link rel="shortcut icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/assets/style/style.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="header-container"></div>

    <div id="game-container">
        <h1>🎹 音游练习</h1>

        <div id="score-container">
            <div class="score-box">
                <span class="score-label">分数</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">准确率</span>
                <span id="accuracy">100%</span>
            </div>
            <div class="score-box">
                <span class="score-label">最佳</span>
                <span id="best">0</span>
            </div>
        </div>

        <div id="mode-selector">
            <button class="mode-btn active" data-mode="practice">练习模式</button>
            <button class="mode-btn" data-mode="melody">旋律模式</button>
        </div>

        <div id="game-header">
            <p class="instructions">使用 <strong>A S D F G H J</strong> 或 <strong>触摸琴键</strong> 弹奏</p>
            <button id="start-btn">开始练习</button>
        </div>

        <div id="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
            <div id="game-message"></div>
            <div id="feedback-display"></div>
        </div>

        <div class="game-footer">
            <p>简单有趣的钢琴音游，练习你的节奏感！</p>
        </div>
    </div>

    <script src="./game.js"></script>

    <div id="footer-container"></div>
    <script src="/assets/js/load-components.js"></script>
</body>
</html>
